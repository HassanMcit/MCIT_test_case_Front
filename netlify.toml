[build]
  base = "."
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Use Netlify's automatically installed, current OpenNext adapter.
# Secrets belong in the Netlify UI (Builds + Functions), never here.
# Preserve App Router, SSR, Auth.js, route handlers and Server Actions.
# Do not use static export or an SPA catch-all redirect.
