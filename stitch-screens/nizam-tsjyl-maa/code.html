<!DOCTYPE html>

<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>نظام إدارة اختبارات الجودة - تسجيل الدخول</title>
<!-- Google Fonts: Cairo & IBM Plex Sans Arabic for high-end enterprise typography -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#00C3F3',
              hover: '#00ade1',
              light: '#e0f8ff',
              subtle: '#f0fbff'
            },
            slateText: {
              title: '#1E293B',
              label: '#334155',
              muted: '#64748B',
              border: '#E2E8F0'
            }
          },
          fontFamily: {
            arabic: ['"IBM Plex Sans Arabic"', '"Cairo"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            'card': '0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 20px 40px -15px rgba(0, 195, 243, 0.07)',
            'btn': '0 4px 14px 0 rgba(0, 195, 243, 0.35)',
            'btn-hover': '0 6px 20px rgba(0, 195, 243, 0.45)'
          }
        }
      }
    }
  </script>
<style>
    body {
      font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
    }
    /* Subtle geometric mesh background */
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.35) 1px, transparent 1px);
    }
    input::placeholder {
      color: #94A3B8;
      font-weight: 400;
    }
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center relative overflow-hidden bg-grid-pattern selection:bg-[#00C3F3] selection:text-white">
<!-- Left Side Abstract Geometric Vector & Overlay Composition -->
<!-- Since canvas is RTL (dir="rtl"), left side is visual left (start from left: 0 / left-0) -->
<div class="pointer-events-none absolute inset-0 w-full h-full overflow-hidden z-0 select-none" style="direction: ltr;"><svg class="absolute inset-0 w-full h-full" fill="none" preserveaspectratio="xMidYMid slice" viewbox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg"><defs><lineargradient id="cyanMain" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00C3F3"></stop><stop offset="100%" stop-color="#0096cc"></stop></lineargradient><lineargradient id="cyanLight" x1="0%" x2="100%" y1="100%" y2="0%"><stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"></stop><stop offset="100%" stop-color="#00C3F3" stop-opacity="0.4"></stop></lineargradient><lineargradient id="cyanSheer1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00C3F3" stop-opacity="0.65"></stop><stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"></stop></lineargradient><lineargradient id="cyanSheer2" x1="100%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00b4e6" stop-opacity="0.45"></stop><stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"></stop></lineargradient><lineargradient id="subtleLine" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#94A3B8" stop-opacity="0.6"></stop><stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.1"></stop></lineargradient></defs><polygon fill="url(#cyanMain)" opacity="0.95" points="-150,950 -100,50 380,480 320,950"></polygon><polygon fill="url(#cyanLight)" opacity="0.85" points="-80,40 280,320 480,-20 -20,-100"></polygon><polygon fill="url(#cyanSheer1)" points="120,240 460,540 340,780 20,440"></polygon><polygon fill="url(#cyanSheer2)" points="260,180 560,450 420,680 180,380"></polygon><polygon fill="none" points="-50,650 360,330 520,700 80,950" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="2"></polygon><rect fill="none" height="260" rx="6" stroke="#00C3F3" stroke-opacity="0.45" stroke-width="1.8" transform="rotate(45 180 600)" width="260" x="180" y="600"></rect><rect fill="none" height="190" rx="4" stroke="#38BDF8" stroke-dasharray="6 4" stroke-opacity="0.35" stroke-width="1.4" transform="rotate(45 240 720)" width="190" x="240" y="720"></rect><line stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5" x1="-60" x2="440" y1="850" y2="380"></line><g opacity="0.55" stroke="#94A3B8" stroke-linecap="round" stroke-width="1.6"><path d="M 1050,-40 L 1320,190 L 1480,70" fill="none"></path><path d="M 940,30 L 1260,310 L 1520,120" fill="none" opacity="0.7" stroke="#64748B" stroke-width="2"></path><path d="M 1120,200 L 1380,420 L 1540,290" fill="none" stroke-dasharray="8 6"></path><path d="M 1260,310 L 1180,400 L 1020,260" fill="none"></path><path d="M 940,30 L 820,140" fill="none"></path><line opacity="0.4" stroke-width="1" x1="1160" x2="1360" y1="100" y2="270"></line><rect fill="none" height="120" opacity="0.35" stroke="#94A3B8" stroke-width="1.2" transform="rotate(45 1160 160)" width="120" x="1160" y="160"></rect></g></svg></div>
<!-- Soft Accent Glow on upper right corner to balance canvas -->
<!-- Main Login Card Container -->
<main class="relative z-10 w-[420px] max-w-[92vw]">
<div class="bg-white rounded-[16px] shadow-card border border-slate-100 p-8 sm:p-9 transition-all duration-300">
<!-- QA Brand Emblem / System Icon (Subtle & Enterprise-grade) -->
<div class="flex justify-center mb-6"><img alt="التحول الرقمي - الإدارة المركزية لنظم المعلومات" class="h-14 sm:h-16 w-auto max-w-[240px] object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC2oy5nCzZXnkHxQdKRBUdvc2WGd-3DSTn0TfT9vVaWhYUl7J74DLEKMj3gpZMVsjiZT6epIZflapbR1worIw_FZiNRNAdoQRnw3ZAg7St4NAbTBZ3Gizn-FyFX4SRoYnVN5c7djdw1S-1OjeAZjVHzfSMNW4bSXqybElko_2Yv1634rnnMxJho1aq6otOBTi4grIsKhYbLiv9aImz4tuUS2hVBnYBaVJ8cm6UcYXsCdYa0Sd9mqxxifGAgMSHYGESAdnE"/></div>
<!-- Card Title -->
<div class="text-center mb-8">
<h1 class="text-[#1E293B] text-[22px] font-bold tracking-normal leading-snug">
          نظام إدارة اختبارات الجودة
        </h1>
<p class="text-xs text-slate-400 mt-1.5 font-medium tracking-wide">
          Quality Assurance Management Portal
        </p>
</div>
<!-- Login Form (Vertical stack, 16px gap) -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div class="relative w-full">
<input class="w-full h-12 pr-11 pl-4 text-sm text-slate-800 bg-white border border-[#E2E8F0] rounded-[8px] outline-none transition-all duration-200 focus:border-[#00C3F3] focus:ring-2 focus:ring-[#00C3F3]/15 hover:border-slate-300 placeholder:text-slate-400 placeholder:text-right text-right" dir="rtl" id="email" name="email" placeholder="البريد الإلكتروني" required="" type="email"/>
<!-- Mail Outline Icon placed inside on the right side -->
<div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5 transition-colors duration-200" fill="none" stroke="currentColor" stroke-width="1.6" viewbox="0 0 24 24">
<path d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Password Input Field -->
<div class="relative w-full">
<input class="w-full h-12 pr-11 pl-11 text-sm text-slate-800 bg-white border border-[#E2E8F0] rounded-[8px] outline-none transition-all duration-200 focus:border-[#00C3F3] focus:ring-2 focus:ring-[#00C3F3]/15 hover:border-slate-300 placeholder:text-slate-400 placeholder:text-right text-right" dir="rtl" id="password" name="password" placeholder="كلمة المرور" required="" type="password"/>
<!-- Lock Outline Icon placed inside on the right side -->
<div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-5 h-5 transition-colors duration-200" fill="none" stroke="currentColor" stroke-width="1.6" viewbox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Eye (Hide/Show) Outline Icon placed on the left side -->
<button aria-label="إظهار أو إخفاء كلمة المرور" class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none" id="togglePassword" onclick="togglePasswordVisibility()" type="button">
<!-- Eye Icon (Open) -->
<svg class="w-5 h-5" fill="none" id="eyeOpen" stroke="currentColor" stroke-width="1.6" viewbox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Eye Slash Icon (Hidden by default) -->
<svg class="w-5 h-5 hidden" fill="none" id="eyeSlash" stroke="currentColor" stroke-width="1.6" viewbox="0 0 24 24">
<path d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Action Button (Full-width, h-48px, radius-10px, #00C3F3) -->
<button class="w-full h-12 mt-2 bg-[#00C3F3] hover:bg-[#00ade1] active:scale-[0.99] text-white font-bold text-base rounded-[10px] shadow-btn hover:shadow-btn-hover transition-all duration-200 flex items-center justify-center cursor-pointer select-none" type="submit">
<span>تسجيل الدخول</span>
</button>
</form>
</div>
</main>
<script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeSlash = document.getElementById('eyeSlash');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeSlash.classList.remove('hidden');
      } else {
        pwdInput.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeSlash.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
