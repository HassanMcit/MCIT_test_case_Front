<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة اختبارات الجودة - تسجيل الدخول</title>
  <!-- Google Fonts: Cairo & IBM Plex Sans Arabic for high-end enterprise typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#00C3F3',
              hover: '#00ade1',
              light: '#e0f8ff',
              subtle: '#f0fbff'
            },
            slateText: {
              title: '#1E293B',
              label: '#334155',
              muted: '#64748B',
              border: '#E2E8F0'
            }
          },
          fontFamily: {
            arabic: ['"IBM Plex Sans Arabic"', '"Cairo"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            'card': '0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 20px 40px -15px rgba(0, 195, 243, 0.07)',
            'btn': '0 4px 14px 0 rgba(0, 195, 243, 0.35)',
            'btn-hover': '0 6px 20px rgba(0, 195, 243, 0.45)'
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
    }
    /* Subtle geometric mesh background */
    .bg-grid-pattern {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.35) 1px, transparent 1px);
    }
    input::placeholder {
      color: #94A3B8;
      font-weight: 400;
    }
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center relative overflow-hidden bg-grid-pattern selection:bg-[#00C3F3] selection:text-white">

  <!-- Left Side Abstract Geometric Vector & Overlay Composition -->
  <!-- Since canvas is RTL (dir="rtl"), left side is visual left (start from left: 0 / left-0) -->
  <div class="pointer-events-none absolute inset-y-0 left-0 w-1/2 overflow-hidden z-0" style="direction: ltr;">
    <!-- Ambient Cyan Glows -->
    <div class="absolute -top-24 -left-20 w-[550px] h-[550px] rounded-full bg-gradient-to-br from-[#00C3F3]/18 via-[#00C3F3]/5 to-transparent blur-3xl transform -rotate-12"></div>
    <div class="absolute bottom-[-100px] left-[-80px] w-[600px] h-[600px] rounded-full bg-gradient-to-tr from-[#00C3F3]/15 via-[#38bdf8]/8 to-transparent blur-3xl"></div>

    <!-- Vector Geometric Lines & Polygonal Overlays -->
    <svg class="absolute inset-0 w-full h-full opacity-60" viewBox="0 0 720 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cyanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00C3F3" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#00C3F3" stop-opacity="0.02" />
        </linearGradient>
        <linearGradient id="cyanGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#00C3F3" stop-opacity="0.3" />
          <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
        </linearGradient>
        <linearGradient id="lineGrad1" x1="0" y1="0" x2="720" y2="900" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#00C3F3" stop-opacity="0.6" />
          <stop offset="50%" stop-color="#00C3F3" stop-opacity="0.2" />
          <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.0" />
        </linearGradient>
      </defs>

      <!-- Soft Polygons / Geometric facets -->
      <polygon points="-80,120 280,40 380,320 80,420" fill="url(#cyanGrad1)" />
      <polygon points="120,440 440,360 490,680 180,740" fill="url(#cyanGrad2)" />
      
      <!-- Thin Elegant Wireframe Lines & Nodes -->
      <line x1="-50" y1="220" x2="380" y2="320" stroke="url(#lineGrad1)" stroke-width="1.2" stroke-dasharray="3 3" />
      <line x1="280" y1="40" x2="490" y2="680" stroke="url(#lineGrad1)" stroke-width="1" />
      <line x1="80" y1="420" x2="440" y2="360" stroke="#00C3F3" stroke-opacity="0.3" stroke-width="1.5" />
      <line x1="440" y1="360" x2="560" y2="520" stroke="#00C3F3" stroke-opacity="0.35" stroke-width="1" />
      <line x1="560" y1="520" x2="260" y2="860" stroke="url(#lineGrad1)" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="-80" y1="620" x2="320" y2="780" stroke="#00C3F3" stroke-opacity="0.2" stroke-width="1" />

      <!-- Minimal Node Points -->
      <circle cx="280" cy="40" r="3" fill="#00C3F3" />
      <circle cx="380" cy="320" r="4" fill="#00C3F3" fill-opacity="0.8" />
      <circle cx="380" cy="320" r="8" stroke="#00C3F3" stroke-opacity="0.3" stroke-width="1" />
      <circle cx="440" cy="360" r="3.5" fill="#00C3F3" />
      <circle cx="490" cy="680" r="3" fill="#00C3F3" fill-opacity="0.7" />
      <circle cx="560" cy="520" r="2.5" fill="#00C3F3" fill-opacity="0.5" />
      <circle cx="80" cy="420" r="3" fill="#00C3F3" fill-opacity="0.6" />
      
      <!-- Subtle Isometric Cube Hint (QA Precision Symbolism) -->
      <g transform="translate(180, 240) scale(0.7)" stroke="#00C3F3" stroke-width="1.2" stroke-opacity="0.4" fill="none">
        <polygon points="50,0 100,28 100,85 50,114 0,85 0,28" stroke-dasharray="2 2" />
        <line x1="50" y1="0" x2="50" y2="57" />
        <line x1="0" y1="28" x2="50" y2="57" />
        <line x1="100" y1="28" x2="50" y2="57" />
        <line x1="50" y1="57" x2="50" y2="114" />
      </g>
    </svg>
  </div>

  <!-- Soft Accent Glow on upper right corner to balance canvas -->
  <div class="pointer-events-none absolute -top-40 -right-40 w-96 h-96 rounded-full bg-slate-200/40 blur-3xl"></div>

  <!-- Main Login Card Container -->
  <main class="relative z-10 w-[420px] max-w-[92vw]">
    <div class="bg-white rounded-[16px] shadow-card border border-slate-100 p-8 sm:p-9 transition-all duration-300">
      
      <!-- QA Brand Emblem / System Icon (Subtle & Enterprise-grade) -->
      <div class="flex justify-center mb-5">
        <div class="w-14 h-14 rounded-2xl bg-[#00C3F3]/10 border border-[#00C3F3]/25 flex items-center justify-center text-[#00C3F3] shadow-sm">
          <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
      </div>

      <!-- Card Title -->
      <div class="text-center mb-8">
        <h1 class="text-[#1E293B] text-[22px] font-bold tracking-normal leading-snug">
          نظام إدارة اختبارات الجودة
        </h1>
        <p class="text-xs text-slate-400 mt-1.5 font-medium tracking-wide">
          Quality Assurance Management Portal
        </p>
      </div>

      <!-- Login Form (Vertical stack, 16px gap) -->
      <form class="flex flex-col gap-4" onsubmit="event.preventDefault();">
        
        <!-- Email Input Field -->
        <div class="relative w-full">
          <input 
            type="email" 
            id="email" 
            name="email"
            dir="rtl"
            placeholder="البريد الإلكتروني" 
            class="w-full h-12 pr-11 pl-4 text-sm text-slate-800 bg-white border border-[#E2E8F0] rounded-[8px] outline-none transition-all duration-200 focus:border-[#00C3F3] focus:ring-2 focus:ring-[#00C3F3]/15 hover:border-slate-300 placeholder:text-slate-400 placeholder:text-right text-right"
            required
          />
          <!-- Mail Outline Icon placed inside on the right side -->
          <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-5 h-5 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
          </div>
        </div>

        <!-- Password Input Field -->
        <div class="relative w-full">
          <input 
            type="password" 
            id="password" 
            name="password"
            dir="rtl"
            placeholder="كلمة المرور" 
            class="w-full h-12 pr-11 pl-11 text-sm text-slate-800 bg-white border border-[#E2E8F0] rounded-[8px] outline-none transition-all duration-200 focus:border-[#00C3F3] focus:ring-2 focus:ring-[#00C3F3]/15 hover:border-slate-300 placeholder:text-slate-400 placeholder:text-right text-right"
            required
          />
          <!-- Lock Outline Icon placed inside on the right side -->
          <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
            <svg class="w-5 h-5 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
          </div>
          <!-- Eye (Hide/Show) Outline Icon placed on the left side -->
          <button 
            type="button" 
            id="togglePassword"
            aria-label="إظهار أو إخفاء كلمة المرور"
            class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors focus:outline-none"
            onclick="togglePasswordVisibility()"
          >
            <!-- Eye Icon (Open) -->
            <svg id="eyeOpen" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <!-- Eye Slash Icon (Hidden by default) -->
            <svg id="eyeSlash" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>

        <!-- Action Button (Full-width, h-48px, radius-10px, #00C3F3) -->
        <button 
          type="submit" 
          class="w-full h-12 mt-2 bg-[#00C3F3] hover:bg-[#00ade1] active:scale-[0.99] text-white font-bold text-base rounded-[10px] shadow-btn hover:shadow-btn-hover transition-all duration-200 flex items-center justify-center cursor-pointer select-none"
        >
          <span>تسجيل الدخول</span>
        </button>

      </form>
    </div>
  </main>

  <script>
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeSlash = document.getElementById('eyeSlash');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeOpen.classList.add('hidden');
        eyeSlash.classList.remove('hidden');
      } else {
        pwdInput.type = 'password';
        eyeOpen.classList.remove('hidden');
        eyeSlash.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
